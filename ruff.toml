# Lint + Format (CI: ruff check . && ruff format --check .)
line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "UP"]

[lint.flake8-bugbear]
# FastAPI-Idiom: File()/Form()/Query() als Default-Werte
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query"]
