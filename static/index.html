<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon Generator – favicon.ico &amp; Favicon-Paket erstellen | KodiniTools</title>
    <!-- SEO: wird vom Server je Sprache ersetzt (main.py, render_index) -->
    <!--SEO-->
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a1324" media="(prefers-color-scheme: dark)">
    <!-- Theme vor dem ersten Paint setzen (Tokens: Dark auf :root, Light über data-theme),
         wie im Collage Maker. Standard ist Light. -->
    <script>
        try {
            document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
        // Sprache vor dem ersten Paint setzen: ?lang=de|en (Links/hreflang) hat Vorrang, sonst
        // localStorage-Key 'locale' wie im Collage Maker; ohne beides gilt die vom Server gesetzte Sprache.
        (function () {
            var param = new URLSearchParams(location.search).get('lang');
            var lang = param === 'en' || param === 'de' ? param : null;
            try {
                if (lang) localStorage.setItem('locale', lang);
                else lang = localStorage.getItem('locale');
            } catch (e) { /* Storage gesperrt */ }
            if (lang === 'en' || lang === 'de') document.documentElement.setAttribute('lang', lang);
        })();
    </script>
    <!-- Design-Tokens v2 (--ds-*), Kopie aus KodiniTools/Collage-Maker src/design-system/tokens-v2.css -->
    <link rel="stylesheet" href="static/design-system/tokens-v2.css">
    <style>
        /* Schrift: Supreme (400/500/700), wie im Collage Maker */
        @font-face { font-family: 'Supreme'; font-weight: 400; font-style: normal; font-display: swap; src: url('static/fonts/Supreme-Regular.woff2') format('woff2'); }
        @font-face { font-family: 'Supreme'; font-weight: 500; font-style: normal; font-display: swap; src: url('static/fonts/Supreme-Medium.woff2') format('woff2'); }
        @font-face { font-family: 'Supreme'; font-weight: 700; font-style: normal; font-display: swap; src: url('static/fonts/Supreme-Bold.woff2') format('woff2'); }

        :root[data-theme='dark'] { color-scheme: dark; }
        :root[data-theme='light'] { color-scheme: light; }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: var(--ds-font-sans);
            font-size: var(--ds-text-lg);
            line-height: var(--ds-leading);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: var(--ds-surface-0);
            color: var(--ds-text);
            transition: background-color var(--ds-duration-slow) var(--ds-ease), color var(--ds-duration-slow) var(--ds-ease);
        }

        /* === SSI-Partials (nav/footer außerhalb von #app), übernommen aus dem Collage Maker ===
           Eigene Hintergründe entfernen, damit die Seitenfläche durchscheint — außer beim Cookie-Banner. */
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']) {
            background-color: transparent !important;
        }
        :where(body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']))
            :where(*:not(.cookie-banner):not(.cookie-consent):not([class*='cookie'])) {
            background-color: transparent !important;
        }
        /* Dropdowns/Submenüs der SSI-Navigation bekommen wieder eine feste Fläche */
        body > :not(#app):not(script) [class*='drop'],
        body > :not(#app):not(script) [class*='sub-menu'],
        body > :not(#app):not(script) [class*='submenu'],
        body > :not(#app):not(script) [class*='popup'],
        body > :not(#app):not(script) [class*='popover'],
        body > :not(#app):not(script) [class*='megamenu'] {
            background-color: var(--ds-surface-1) !important;
        }
        /* Hamburger-Balken und SVG-Icons der Navigation in Textfarbe */
        body > :not(#app):not(script) span:empty,
        body > :not(#app):not(script) [aria-expanded] > span:empty,
        body > :not(#app):not(script) [aria-expanded] > span > span:empty,
        body > :not(#app):not(script) [aria-expanded] > div > span:empty {
            background-color: currentColor !important;
            border-color: currentColor !important;
        }
        body > :not(#app):not(script) button svg line,
        body > :not(#app):not(script) button svg path,
        body > :not(#app):not(script) button svg rect,
        body > :not(#app):not(script) [aria-expanded] svg line,
        body > :not(#app):not(script) [aria-expanded] svg path,
        body > :not(#app):not(script) [aria-expanded] svg rect,
        body > :not(#app):not(script) [role='button'] svg line,
        body > :not(#app):not(script) [role='button'] svg path,
        body > :not(#app):not(script) [role='button'] svg rect {
            stroke: currentColor !important;
            fill: currentColor !important;
        }
        body > :not(#app):not(script) [class*='toggler-icon'] { filter: brightness(0) saturate(100%) !important; }
        :root[data-theme='dark'] body > :not(#app):not(script) [class*='toggler-icon'] {
            filter: brightness(0) saturate(100%) invert(1) !important;
        }
        /* Cookie-Banner: immer im Vordergrund, über Nav und Dropdowns */
        .cookie-banner, .cookie-consent,
        [class*='cookie-banner'], [class*='cookie-consent'],
        [id*='cookie-banner'], [id*='cookie-consent'] {
            z-index: 10000 !important;
            position: fixed !important;
        }
        /* Textfarben der SSI-Partials aus den Tokens (Cookie-Banner ausgenommen) */
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']):not([id*='cookie']),
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']):not([id*='cookie']) *:not([class*='cookie']):not([id*='cookie']) {
            color: var(--ds-text) !important;
        }
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']):not([id*='cookie']) a:not([class*='cookie']):not([id*='cookie']),
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']):not([id*='cookie']) a:not([class*='cookie']):not([id*='cookie']) *,
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']):not([id*='cookie']) button.footer-link:not([class*='cookie']):not([id*='cookie']) {
            color: var(--ds-link) !important;
        }
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']):not([id*='cookie']) a:hover:not([class*='cookie']):not([id*='cookie']),
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']):not([id*='cookie']) a:hover:not([class*='cookie']):not([id*='cookie']) *,
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']):not([id*='cookie']) button.footer-link:hover:not([class*='cookie']):not([id*='cookie']) {
            color: var(--ds-accent) !important;
        }
        /* Footer-Link als <button> (Cookie-Einstellungen) wie die übrigen Links setzen */
        body > :not(#app) button.footer-link { line-height: inherit; font-weight: inherit; letter-spacing: inherit; }

        /* === App === */
        #app {
            display: flex;
            justify-content: center;
            padding: var(--ds-space-12) var(--ds-space-4);
        }
        .card {
            background: var(--ds-surface-1);
            padding: var(--ds-space-10);
            border-radius: var(--ds-radius-lg);
            border: var(--ds-border-width) solid var(--ds-border);
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        h1 {
            margin: 0 0 var(--ds-space-3);
            font-size: var(--ds-text-2xl);
            font-weight: var(--ds-weight-bold);
            line-height: var(--ds-leading-tight);
            letter-spacing: var(--ds-tracking-tight);
            color: var(--ds-text);
        }
        p { color: var(--ds-text-2); font-size: var(--ds-text-md); margin: 0 0 var(--ds-space-6); }
        code { font-family: var(--ds-font-mono); font-size: 0.9em; }
        .dropzone {
            position: relative;
            display: block;
            border: 2px dashed var(--ds-border-strong);
            border-radius: var(--ds-radius-md);
            padding: var(--ds-space-10) var(--ds-space-4);
            cursor: pointer;
            color: var(--ds-text-2);
            background: var(--ds-surface-0);
            transition: border-color var(--ds-duration) var(--ds-ease), background-color var(--ds-duration) var(--ds-ease);
        }
        .dropzone:hover, .dropzone.dragover { border-color: var(--ds-accent); background: var(--ds-accent-soft); color: var(--ds-text); }
        .dropzone:focus-within { box-shadow: var(--ds-focus-ring); }
        /* Visuell versteckt, aber per Tastatur fokussierbar und für Screenreader erreichbar
           (display: none würde die Dateiauswahl aus der Tab-Reihenfolge entfernen) */
        input[type="file"] {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }
        fieldset {
            border: var(--ds-border-width) solid var(--ds-border);
            border-radius: var(--ds-radius-md);
            margin: var(--ds-space-5) 0 0;
            padding: var(--ds-space-3) var(--ds-space-4) var(--ds-space-4);
            text-align: left;
        }
        legend { color: var(--ds-text-2); font-size: var(--ds-text-sm); font-weight: var(--ds-weight-medium); padding: 0 var(--ds-space-2); }
        .options { display: flex; flex-wrap: wrap; gap: var(--ds-space-2) var(--ds-space-4); }
        .options label { font-size: var(--ds-text-md); cursor: pointer; display: inline-flex; align-items: center; gap: var(--ds-space-1); }
        input[type="radio"], input[type="checkbox"] { accent-color: var(--ds-accent); }
        input[type="text"] {
            width: 100%;
            padding: var(--ds-space-2) var(--ds-space-3);
            border-radius: var(--ds-radius-sm);
            border: var(--ds-border-width) solid var(--ds-border-strong);
            background: var(--ds-surface-1);
            color: var(--ds-text);
            font: inherit;
            font-size: var(--ds-text-sm);
        }
        input[type="text"]::placeholder { color: var(--ds-text-3); }
        select {
            width: 100%;
            padding: var(--ds-space-2) var(--ds-space-3);
            border-radius: var(--ds-radius-sm);
            border: var(--ds-border-width) solid var(--ds-border-strong);
            background: var(--ds-surface-1);
            color: var(--ds-text);
            font: inherit;
            font-size: var(--ds-text-sm);
        }
        select:focus-visible { outline: none; box-shadow: var(--ds-focus-ring); }
        /* Schriftauswahl: eigene Liste, damit jede Schrift in sich selbst angezeigt wird */
        .font-picker { position: relative; min-width: 0; }
        .font-picker-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--ds-space-2);
            width: 100%;
            padding: var(--ds-space-2) var(--ds-space-3);
            border-radius: var(--ds-radius-sm);
            border: var(--ds-border-width) solid var(--ds-border-strong);
            background: var(--ds-surface-1);
            color: var(--ds-text);
            font-size: var(--ds-text-md);
            text-align: left;
            cursor: pointer;
        }
        /* Globale App-Button-Stile (Akzentfläche, Hover) hier nicht übernehmen */
        .font-picker-btn { min-height: 0; font-weight: var(--ds-weight-regular); }
        .font-picker-btn:hover, .font-picker-btn[aria-expanded="true"] { background: var(--ds-surface-1); border-color: var(--ds-accent); }
        .font-picker-btn::after {
            content: '';
            flex: none;
            border: 0.3em solid transparent;
            border-top-color: currentColor;
            border-bottom: 0;
        }
        .font-picker-btn:focus-visible, .font-picker-list:focus-visible { outline: none; box-shadow: var(--ds-focus-ring); }
        .font-picker-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .font-picker-list {
            position: absolute;
            z-index: 10;
            top: calc(100% + var(--ds-space-1));
            left: 0;
            width: max(100%, 16rem);
            max-height: 20rem;
            overflow-y: auto;
            margin: 0;
            padding: var(--ds-space-1);
            list-style: none;
            border-radius: var(--ds-radius-sm);
            border: var(--ds-border-width) solid var(--ds-border-strong);
            background: var(--ds-surface-1);
            box-shadow: var(--ds-shadow-overlay);
        }
        .font-picker-list[hidden] { display: none; }
        .font-picker-list li {
            padding: var(--ds-space-2) var(--ds-space-3);
            border-radius: var(--ds-radius-sm);
            font-size: var(--ds-text-lg);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        .font-picker-list li.active { background: var(--ds-surface-2); }
        .font-picker-list li[aria-selected="true"] { background: var(--ds-accent-soft); }
        /* Gestaltung / Paket-Optionen: Zeilen aus Beschriftung, Regler und Wert */
        .field {
            display: grid;
            grid-template-columns: minmax(7rem, 11rem) 1fr 3.5rem;
            align-items: center;
            gap: var(--ds-space-2) var(--ds-space-3);
            font-size: var(--ds-text-md);
        }
        .field + .field { margin-top: var(--ds-space-3); }
        .field label { display: inline-flex; align-items: center; gap: var(--ds-space-1); cursor: pointer; }
        .field output { font-variant-numeric: tabular-nums; color: var(--ds-text-2); text-align: right; }
        .field.stack { grid-template-columns: 1fr; gap: var(--ds-space-1); }
        input[type="range"] { width: 100%; accent-color: var(--ds-accent); }
        input[type="color"] {
            width: 3rem;
            height: var(--ds-control-sm);
            padding: 2px;
            border: var(--ds-border-width) solid var(--ds-border-strong);
            border-radius: var(--ds-radius-sm);
            background: var(--ds-surface-1);
            cursor: pointer;
        }
        input[type="color"]:disabled { opacity: 0.4; cursor: not-allowed; }
        details.snippet { margin-top: var(--ds-space-5); text-align: left; }
        details.snippet summary { cursor: pointer; font-size: var(--ds-text-sm); font-weight: var(--ds-weight-medium); color: var(--ds-text-2); }
        details.snippet pre {
            margin: var(--ds-space-3) 0;
            padding: var(--ds-space-3);
            overflow-x: auto;
            background: var(--ds-surface-0);
            border: var(--ds-border-width) solid var(--ds-border);
            border-radius: var(--ds-radius-sm);
            font-size: var(--ds-text-xs);
            line-height: 1.5;
        }
        .copy-row { display: flex; align-items: center; gap: var(--ds-space-3); }
        .copy-row button { flex: 0 0 auto; min-height: var(--ds-control-md); padding: var(--ds-space-2) var(--ds-space-4); font-size: var(--ds-text-md); }
        #copyStatus { font-size: var(--ds-text-sm); color: var(--ds-text-2); }
        input:focus-visible, button:focus-visible { outline: none; box-shadow: var(--ds-focus-ring); }
        /* Quelle: Bild oder Text/Emoji */
        .mode { display: flex; gap: var(--ds-space-2); margin-bottom: var(--ds-space-4); }
        .mode label {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--ds-space-2);
            min-height: var(--ds-control-md);
            border: var(--ds-border-width) solid var(--ds-border-strong);
            border-radius: var(--ds-radius-md);
            background: var(--ds-surface-2);
            font-size: var(--ds-text-md);
            font-weight: var(--ds-weight-medium);
            cursor: pointer;
        }
        .mode label:has(input:checked) { border-color: var(--ds-accent); background: var(--ds-accent-soft); }
        .mode input { accent-color: var(--ds-accent); }
        .mode label:focus-within { box-shadow: var(--ds-focus-ring); }
        #textPanel { text-align: left; border: 2px dashed var(--ds-border-strong); border-radius: var(--ds-radius-md); padding: var(--ds-space-4); background: var(--ds-surface-0); }
        #textPanel[hidden], .dropzone[hidden] { display: none; }
        #mockups { display: none; margin-top: var(--ds-space-5); gap: var(--ds-space-4); flex-wrap: wrap; justify-content: center; align-items: flex-end; }
        #mockups figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: var(--ds-space-1); }
        #mockups figcaption { font-size: var(--ds-text-xs); color: var(--ds-text-3); }
        #mockups canvas { border-radius: var(--ds-radius-sm); }
        #preview { display: none; margin-top: var(--ds-space-5); align-items: flex-end; justify-content: center; gap: var(--ds-space-4); }
        #preview figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: var(--ds-space-1); }
        #preview figcaption { font-size: var(--ds-text-xs); color: var(--ds-text-3); }
        #preview canvas {
            /* Schachbrett zur Darstellung von Transparenz */
            background: repeating-conic-gradient(var(--ds-surface-3) 0% 25%, var(--ds-surface-1) 0% 50%) 0 0 / 8px 8px;
            image-rendering: pixelated;
            border: var(--ds-border-width) solid var(--ds-border);
            border-radius: 2px;
        }
        .buttons { display: flex; gap: var(--ds-space-3); margin-top: var(--ds-space-6); }
        :where(#app) button {
            flex: 1;
            min-height: var(--ds-control-lg);
            background: var(--ds-accent);
            color: var(--ds-on-accent);
            border: var(--ds-border-width) solid transparent;
            padding: var(--ds-space-3);
            border-radius: var(--ds-radius-md);
            font: inherit;
            font-size: var(--ds-text-lg);
            font-weight: var(--ds-weight-semibold);
            cursor: pointer;
            transition: background-color var(--ds-duration) var(--ds-ease), border-color var(--ds-duration) var(--ds-ease);
        }
        :where(#app) button:hover { background: var(--ds-accent-hover); }
        :where(#app) button.secondary { background: var(--ds-surface-2); color: var(--ds-text); border-color: var(--ds-border-strong); }
        :where(#app) button.secondary:hover { background: var(--ds-surface-3); border-color: var(--ds-accent); }
        :where(#app) button:disabled { opacity: 0.6; cursor: wait; }
        #status { margin-top: var(--ds-space-4); font-size: var(--ds-text-md); font-weight: var(--ds-weight-medium); min-height: 1.5em; }
        @media (max-width: 480px) {
            #app { padding: var(--ds-space-6) var(--ds-space-4); }
            .card { padding: var(--ds-space-6); }
            .buttons { flex-direction: column; }
            .field { grid-template-columns: 1fr 3.5rem; }
            .field > :first-child { grid-column: 1 / -1; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <!--#include virtual="/partials/nav.html" -->
    <main id="app">
    <div class="card">
        <h1 data-i18n="title">Favicon Konverter</h1>
        <p data-i18n-html="intro">Erstelle aus einem Bild (PNG, JPG, WebP, GIF, BMP – max. 10&nbsp;MB) ein <code>favicon.ico</code> oder ein komplettes Favicon-Paket.</p>

        <form id="uploadForm">
            <div class="mode" role="radiogroup" data-i18n-aria="modeLabel" aria-label="Quelle">
                <label><input type="radio" name="mode" value="image" checked> <span data-i18n="modeImage">Bild</span></label>
                <label><input type="radio" name="mode" value="text"> <span data-i18n="modeText">Text / Emoji</span></label>
            </div>

            <label class="dropzone" id="dropzone">
                <span id="label-text">Datei auswählen oder hierher ziehen</span>
                <input type="file" id="fileInput" name="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml,.svg">
            </label>

            <div id="textPanel" hidden>
                <div class="field">
                    <label for="iconText" data-i18n="textLabel">Text oder Emoji</label>
                    <input type="text" id="iconText" maxlength="4" value="K" autocomplete="off" data-i18n-placeholder="textPlaceholder" placeholder="z. B. K oder 🚀">
                    <span></span>
                </div>
                <div class="field">
                    <label for="textFontBtn" id="textFontLabel" data-i18n="fontLabel">Schrift</label>
                    <div class="font-picker">
                        <input type="hidden" id="textFont" value="">
                        <button type="button" class="font-picker-btn" id="textFontBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="textFontList" aria-labelledby="textFontLabel textFontValue">
                            <span class="font-picker-value" id="textFontValue" data-i18n="fontSystem">Systemschrift (fett)</span>
                        </button>
                        <ul class="font-picker-list" id="textFontList" role="listbox" tabindex="-1" aria-labelledby="textFontLabel" hidden>
                            <li role="option" id="textFontOpt-sys" data-value="" aria-selected="true" data-i18n="fontSystem">Systemschrift (fett)</li>
                        </ul>
                    </div>
                    <span></span>
                </div>
                <div class="field">
                    <label for="textColor" data-i18n="textColorLabel">Textfarbe</label>
                    <input type="color" id="textColor" value="#1f2937">
                    <span></span>
                </div>
            </div>

            <div id="preview">
                <figure><canvas id="pv64" width="64" height="64"></canvas><figcaption>64</figcaption></figure>
                <figure><canvas id="pv32" width="32" height="32"></canvas><figcaption>32</figcaption></figure>
                <figure><canvas id="pv16" width="16" height="16"></canvas><figcaption>16</figcaption></figure>
            </div>

            <!-- So sieht das Icon im Einsatz aus (gezeichnet wie auf dem Server) -->
            <div id="mockups">
                <figure><canvas id="mkTabLight" width="220" height="40"></canvas><figcaption data-i18n="mockTabLight">Browser-Tab hell</figcaption></figure>
                <figure><canvas id="mkTabDark" width="220" height="40"></canvas><figcaption data-i18n="mockTabDark">Browser-Tab dunkel</figcaption></figure>
                <figure><canvas id="mkIos" width="60" height="60"></canvas><figcaption>iOS</figcaption></figure>
                <figure><canvas id="mkAndroid" width="60" height="60"></canvas><figcaption>Android</figcaption></figure>
            </div>

            <fieldset>
                <legend data-i18n="fitLegend">Nicht-quadratische Bilder</legend>
                <div class="options">
                    <label><input type="radio" name="fit" value="pad" checked> <span data-i18n="fitPad">Transparent auffüllen</span></label>
                    <label><input type="radio" name="fit" value="crop"> <span data-i18n="fitCrop">Mittig zuschneiden</span></label>

        // Nur #app übersetzen; die Navigation hat eigene data-i18n-Schlüssel (translateNav)

        const MAX_BYTES = 10 * 1024 * 1024;
        const ALLOWED_SIZES = [16, 24, 32, 48, 64, 128, 256];
        const DEFAULT_SIZES = [16, 32, 48, 64];

        const textFontBtn = document.getElementById('textFontBtn');

        const textFontList = document.getElementById('textFontList');

        const MASKABLE_CONTENT_RATIO = 0.8 / Math.SQRT2;

        let svgText = null;

        let previewImage = null;
        // Zuletzt angezeigte eigene Statusmeldung, damit sie beim Sprachwechsel neu übersetzt wird

        function roundedRectPath(ctx, size, r) {
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(0, 0, size, size, r);
                return;
            }
            ctx.moveTo(r, 0);
            ctx.arcTo(size, 0, size, size, r);
            ctx.arcTo(size, size, 0, size, r);
            ctx.arcTo(0, size, 0, 0, r);
            ctx.arcTo(0, 0, size, 0, r);
            ctx.closePath();
        }

        // Text/Emoji möglichst groß und optisch zentriert auf eine transparente Fläche zeichnen
        function renderTextCanvas(size) {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = size;
            const text = iconText.value.trim();
            if (!text) return null;
            const ctx = canvas.getContext('2d');
            const custom = loadedFonts.get(textFont.value);
            // Eigene Schrift: Schnitt steckt in der Datei, daher normales Gewicht (kein künstliches Fett)
            const weight = custom ? 400 : 700;
            const family = custom ? `"${custom}", ${FONT_FALLBACK}` : FONT_FALLBACK;
            ctx.fillStyle = textColor.value;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            let fontSize = size;
            ctx.font = `${weight} ${fontSize}px ${family}`;
            let m = ctx.measureText(text);
            const boxW = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
            const boxH = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
            fontSize *= Math.min((size * 0.86) / Math.max(boxW, 1), (size * 0.86) / Math.max(boxH, 1));
            ctx.font = `${weight} ${fontSize}px ${family}`;
            m = ctx.measureText(text);
            const x = (size - (m.actualBoundingBoxLeft + m.actualBoundingBoxRight)) / 2 + m.actualBoundingBoxLeft;
            const y = (size - (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent)) / 2 + m.actualBoundingBoxAscent;
            ctx.fillText(text, x, y);
            return canvas;
        }

        // Aktuelle Quelle als zeichenbares Objekt: {img, w, h} oder null
        function currentSource() {
            if (currentMode() === 'text') {
                const canvas = renderTextCanvas(512);
                return canvas ? { img: canvas, w: canvas.width, h: canvas.height } : null;
            }
            if (!previewImage) return null;
            // SVG ohne width/height liefert im Browser teils 0 als natürliche Größe
            const w = previewImage.naturalWidth || 512;
            const h = previewImage.naturalHeight || 512;
            return { img: previewImage, w, h };
        }

        // Zeichnet die Quelle quadratisch (pad/crop) in ein Feld (x, y, size) – ohne Gestaltung
        function drawSquare(ctx, src, x, y, size) {
            if (currentFit() === 'crop') {
                const side = Math.min(src.w, src.h);
                ctx.drawImage(src.img, (src.w - side) / 2, (src.h - side) / 2, side, side, x, y, size, size);
            } else {
                const scale = size / Math.max(src.w, src.h);
                const dw = src.w * scale, dh = src.h * scale;
                ctx.drawImage(src.img, x + (size - dw) / 2, y + (size - dh) / 2, dw, dh);
            }
        }

        // Icon mit Gestaltung wie auf dem Server (favicon_core.apply_style) an Position (x, y)
        function drawStyled(ctx, src, style, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.imageSmoothingQuality = 'high';
            if (style.radius) {
                roundedRectPath(ctx, size, (size / 2) * (style.radius / 100));
                ctx.clip();
            }
            if (style.background) {
                ctx.fillStyle = style.background;
                ctx.fillRect(0, 0, size, size);
            }
            const inner = Math.max(1, size * (100 - 2 * style.padding) / 100);
            drawSquare(ctx, src, (size - inner) / 2, (size - inner) / 2, inner);
            ctx.restore();
        }

        const TAB_THEMES = {
            light: { strip: '#dee1e6', tab: '#ffffff', text: '#1f1f1f' },
            dark: { strip: '#202124', tab: '#35363a', text: '#e8eaed' },
        };

        function drawTab(canvas, theme, src, style) {
            const ctx = canvas.getContext('2d');
            const c = TAB_THEMES[theme];
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = c.strip;
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = c.tab;
            ctx.beginPath();
            ctx.moveTo(6, h);
            ctx.arcTo(6, 6, 18, 6, 8);
            ctx.arcTo(w - 6, 6, w - 6, h, 8);
            ctx.lineTo(w - 6, h);
            ctx.closePath();
            ctx.fill();
            drawStyled(ctx, src, style, 18, 15, 16);
            ctx.fillStyle = c.text;
            ctx.font = '12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
            ctx.textBaseline = 'middle';
            const title = appName.value.trim() || t('tabTitleDefault');
            let shown = title;
            while (shown.length > 1 && ctx.measureText(shown + '…').width > w - 60) shown = shown.slice(0, -1);
            ctx.fillText(shown === title ? title : shown + '…', 42, 23);
        }

        function drawHomeIcon(canvas, src, style, platform) {
            const ctx = canvas.getContext('2d');
            const size = canvas.width;
            ctx.clearRect(0, 0, size, size);
            ctx.save();
            ctx.beginPath();
            if (platform === 'ios') {
                // iOS rundet selbst ab; Server liefert deckend mit Innenabstand, ohne Radius
                roundedRectPath(ctx, size, size * 0.225);
            } else {
                // Android maskiert z. B. kreisförmig; maskable Icon mit Motiv in der Safe Zone
                ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
            }
            ctx.clip();
            ctx.fillStyle = style.background || '#ffffff';
            ctx.fillRect(0, 0, size, size);
            if (platform === 'ios') {
                drawStyled(ctx, src, { background: '', padding: style.padding, radius: 0 }, 0, 0, size);
            } else {
                const inner = size * MASKABLE_CONTENT_RATIO;
                drawSquare(ctx, src, (size - inner) / 2, (size - inner) / 2, inner);
            }
            ctx.restore();
        }

        function drawPreview() {
            const src = currentSource();
            if (!src) {
                preview.style.display = 'none';
                mockups.style.display = 'none';
                return;
            }
            const style = currentStyle();
            for (const size of [64, 32, 16]) {
                const ctx = document.getElementById('pv' + size).getContext('2d');
                ctx.clearRect(0, 0, size, size);
                drawStyled(ctx, src, style, 0, 0, size);

            drawTab(document.getElementById('mkTabLight'), 'light', src, style);
            drawTab(document.getElementById('mkTabDark'), 'dark', src, style);
            drawHomeIcon(document.getElementById('mkIos'), src, style, 'ios');
            drawHomeIcon(document.getElementById('mkAndroid'), src, style, 'android');
            preview.style.display = 'flex';
            mockups.style.display = 'flex';
        }

        // Datei für den Upload: Rasterbilder unverändert, SVG und Text als PNG aus dem Browser
        async function uploadBlob() {
            if (currentMode() === 'text') {
                const canvas = renderTextCanvas(RASTER_SIZE);
                if (!canvas) return { error: 'noText' };
                return { blob: await new Promise(r => canvas.toBlob(r, 'image/png')), name: 'text.png' };
            }
            const file = fileInput.files[0];
            if (!file) return { error: 'noFile' };
            if (file.size > MAX_BYTES) return { error: 'tooLarge' };
            if (svgText === null) return { blob: file, name: file.name };
            const src = currentSource();
            if (!src) return { error: 'previewFailed' };
            const scale = RASTER_SIZE / Math.max(src.w, src.h);
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(src.w * scale));
            canvas.height = Math.max(1, Math.round(src.h * scale));
            canvas.getContext('2d').drawImage(src.img, 0, 0, canvas.width, canvas.height);
            return { blob: await new Promise(r => canvas.toBlob(r, 'image/png')), name: file.name.replace(/\.svg$/i, '') + '.png' };
        }

        function updateMode() {
            const text = currentMode() === 'text';
            dropzone.hidden = text;
            textPanel.hidden = !text;
            drawPreview();
            loadSnippet();
        }

        function updateStyleControls() {
            bgColor.disabled = !bgEnabled.checked;
            themeColor.disabled = !themeEnabled.checked;
            paddingInput.nextElementSibling.textContent = paddingInput.value + '\u00a0%';
            radiusInput.nextElementSibling.textContent = radiusInput.value + '\u00a0%';
        }

        function styleFields() {
            const style = currentStyle();
            return { background: style.background, padding: String(style.padding), radius: String(style.radius) };
        }

        // --- HTML-Snippet (Quelle: GET snippet, identisch mit favicon-snippet.html im Paket) ---
        let snippetRequest = 0;
        async function loadSnippet() {
            const request = ++snippetRequest;
            const params = new URLSearchParams({ lang: locale });
            if (currentMode() === 'image' && svgText !== null) params.set('svg', 'true');
            if (themeEnabled.checked) params.set('theme_color', themeColor.value);
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            try {
                const res = await fetch('snippet?' + params, { signal: controller.signal });
                if (!res.ok) throw new Error(await errorMessage(res));
                const text = await res.text();
                if (request === snippetRequest) snippetCode.textContent = text;
            } catch (err) {
                console.warn('Snippet konnte nicht geladen werden:', err);
                if (request === snippetRequest) snippetCode.textContent = t('snippetError');
            } finally {
                clearTimeout(timeout);
            }
        }

        async function copySnippet() {
            const text = snippetCode.textContent;
            let ok = false;
            try {
                await navigator.clipboard.writeText(text);
                ok = true;
            } catch (_) {
                // Fallback ohne Clipboard-API (z. B. ohne HTTPS): Text markieren und kopieren
                const range = document.createRange();
                range.selectNodeContents(snippetCode);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
            }
            copyStatus.textContent = t(ok ? 'copied' : 'copyFailed');
        }

        function isSvg(file) {
            return file.type === 'image/svg+xml' || /\.svg$/i.test(file.name);
        }

        async function loadPreview(file) {
            previewImage = null;
            svgText = null;
            drawPreview();
            if (isSvg(file)) {
                try { svgText = await file.text(); } catch (_) { svgText = null; }
            }
            loadSnippet();
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(url);
                if (fileInput.files[0] !== file) return; // inzwischen andere Datei gewählt
                previewImage = img;
                drawPreview();
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                setStatusKey('previewFailed', 'var(--ds-warning)');
            };
            img.src = url;
        }

        function onFileSelected() {
            setStatus('', '');
            const file = fileInput.files[0];
            if (!file) return;
            labelText.textContent = file.name;
            if (file.size > MAX_BYTES) {
                setStatusKey('tooLarge', 'var(--ds-danger)');
                return;
            }
            loadPreview(file);
        }

        fileInput.addEventListener('change', onFileSelected);
        form.querySelectorAll('input[name="fit"]').forEach(r => r.addEventListener('change', drawPreview));
        [bgEnabled, bgColor, paddingInput, radiusInput].forEach(el => el.addEventListener('input', () => {
            updateStyleControls();
            drawPreview();
        }));
        bgEnabled.addEventListener('change', () => { updateStyleControls(); drawPreview(); });
        themeEnabled.addEventListener('change', () => { updateStyleControls(); loadSnippet(); });
        themeColor.addEventListener('change', loadSnippet);
        btnCopy.addEventListener('click', copySnippet);
        form.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', updateMode));
        [iconText, textColor].forEach(el => el.addEventListener('input', drawPreview));

        // --- Schriften aus static/fonts (GET fonts); neue Dateien erscheinen nach dem Deploy automatisch ---
        // Jede Schrift wird in der Liste, im Auswahlfeld und im Eingabefeld in sich selbst dargestellt.
        let fontList = [];
        const fontLoads = new Map();

        // Lädt eine Schrift genau einmal; liefert den Familiennamen oder null bei Fehler
        function ensureFont(value) {
            const font = fontList[Number(value)];
            if (value === '' || !font) return Promise.resolve(null);
            if (!fontLoads.has(value)) {
                const family = 'favicon-font-' + value;
                fontLoads.set(value, (async () => {
                    try {
                        const face = new FontFace(family, `url("${font.url}") format("${font.format}")`);
                        document.fonts.add(await face.load());
                        loadedFonts.set(value, family);
                        return family;
                    } catch (err) {
                        console.warn('Schrift konnte nicht geladen werden:', font.url, err);
                        return null;
                    }
                })());
            }
            return fontLoads.get(value);
        }

        function fontCss(value) {
            return value === '' ? FONT_FALLBACK : `"favicon-font-${value}", ${FONT_FALLBACK}`;
        }

        function fontOptions() {
            return [...textFontList.querySelectorAll('[role="option"]')];
        }

        // Schriften erst laden, wenn ihr Eintrag in der geöffneten Liste sichtbar wird
        const fontObserver = 'IntersectionObserver' in window
            ? new IntersectionObserver(entries => entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                fontObserver.unobserve(entry.target);
                ensureFont(entry.target.dataset.value);
            }), { root: textFontList, rootMargin: '200px 0px' })
            : null;

        async function loadFontList() {
            try {
                const res = await fetch('fonts');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                fontList = await res.json();
            } catch (err) {
                console.warn('Schriftliste nicht verfügbar:', err);
                fontList = [];
            }
            fontList.forEach((font, i) => {
                const li = document.createElement('li');
                li.id = 'textFontOpt-' + i;
                li.setAttribute('role', 'option');
                li.setAttribute('aria-selected', 'false');
                li.dataset.value = String(i);
                li.textContent = font.label;
                li.style.fontFamily = fontCss(String(i));
                textFontList.append(li);
                if (fontObserver) fontObserver.observe(li);
            });
        }

        // Zustand setzen und überall in der gewählten Schrift anzeigen
        function setFontValue(value) {
            textFont.value = value;
            const opt = fontOptions().find(o => o.dataset.value === value);
            fontOptions().forEach(o => o.setAttribute('aria-selected', String(o === opt)));
            if (value === '') {
                textFontValue.setAttribute('data-i18n', 'fontSystem');
                textFontValue.textContent = t('fontSystem');
            } else {
                textFontValue.removeAttribute('data-i18n');
                textFontValue.textContent = opt ? opt.textContent : '';
            }
            const weight = value === '' ? '700' : '400';
            [textFontValue, iconText].forEach(el => {
                el.style.fontFamily = fontCss(value);
                el.style.fontWeight = weight;
            });
        }

        async function selectFont(value) {
            setFontValue(value);
            const family = await ensureFont(value);
            if (textFont.value !== value) return; // inzwischen andere Schrift gewählt
            if (value !== '' && !family) {
                setStatusKey('fontLoadFailed', 'var(--ds-warning)');
                setFontValue('');
            }
            drawPreview();
        }

        // --- Listbox-Bedienung (Maus, Tastatur, Screenreader) ---
        let activeIndex = 0;
        function setActive(index) {
            const opts = fontOptions();
            if (!opts.length) return;
            activeIndex = Math.max(0, Math.min(opts.length - 1, index));
            opts.forEach((o, i) => o.classList.toggle('active', i === activeIndex));
            textFontList.setAttribute('aria-activedescendant', opts[activeIndex].id);
            opts[activeIndex].scrollIntoView({ block: 'nearest' });
        }
        function openFontList() {
            textFontList.hidden = false;
            textFontBtn.setAttribute('aria-expanded', 'true');
            setActive(Math.max(0, fontOptions().findIndex(o => o.dataset.value === textFont.value)));
            textFontList.focus();
        }
        function closeFontList(returnFocus = true) {
            if (textFontList.hidden) return;
            textFontList.hidden = true;
            textFontBtn.setAttribute('aria-expanded', 'false');
            if (returnFocus) textFontBtn.focus();
        }
        function chooseActive() {
            const opt = fontOptions()[activeIndex];
            closeFontList();
            if (opt && opt.dataset.value !== textFont.value) selectFont(opt.dataset.value);
        }

        textFontBtn.addEventListener('click', () => (textFontList.hidden ? openFontList() : closeFontList()));
        textFontBtn.addEventListener('keydown', e => {
            if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(e.key)) {
                e.preventDefault();
                openFontList();
            }
        });
        textFontList.addEventListener('keydown', e => {
            const last = fontOptions().length - 1;
            switch (e.key) {
                case 'ArrowDown': setActive(activeIndex + 1); break;
                case 'ArrowUp': setActive(activeIndex - 1); break;
                case 'Home': setActive(0); break;
                case 'End': setActive(last); break;
                case 'PageDown': setActive(activeIndex + 8); break;
                case 'PageUp': setActive(activeIndex - 8); break;
                case 'Enter': case ' ': chooseActive(); break;
                case 'Escape': closeFontList(); break;
                case 'Tab': closeFontList(false); return;
                default: {
                    // Tippen springt zum nächsten Eintrag mit diesem Anfangsbuchstaben
                    if (e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return;
                    const opts = fontOptions();
                    const key = e.key.toLowerCase();
                    for (let step = 1; step <= opts.length; step++) {
                        const i = (activeIndex + step) % opts.length;
                        if (opts[i].textContent.trim().toLowerCase().startsWith(key)) { setActive(i); break; }
                    }
                }
            }
            e.preventDefault();
        });
        textFontList.addEventListener('click', e => {
            const opt = e.target.closest('[role="option"]');
            if (!opt) return;
            setActive(fontOptions().indexOf(opt));
            chooseActive();
        });
        textFontList.addEventListener('mousemove', e => {
            const opt = e.target.closest('[role="option"]');
            if (opt) {
                const i = fontOptions().indexOf(opt);
                if (i !== activeIndex) {
                    activeIndex = i;
                    fontOptions().forEach((o, j) => o.classList.toggle('active', j === i));
                    textFontList.setAttribute('aria-activedescendant', opt.id);
                }
            }
        });
        document.addEventListener('pointerdown', e => {
            if (!textFontList.hidden && !e.target.closest('.font-picker')) closeFontList(false);
        });
        const systemOption = document.getElementById('textFontOpt-sys');
        systemOption.style.fontFamily = FONT_FALLBACK;
        systemOption.style.fontWeight = '700';
        setFontValue('');
        appName.addEventListener('input', drawPreview);

        ['dragenter', 'dragover'].forEach(ev => dropzone.addEventListener(ev, e => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        }));
        ['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
        }));
        dropzone.addEventListener('drop', e => {
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                onFileSelected();
            }
        });

        async function errorMessage(res) {
            try {
                const data = await res.json();
                if (typeof data.detail === 'string') return data.detail;
            } catch (_) { /* keine JSON-Antwort */ }
            return t('httpError', { status: res.status });
        }

        async function generate(endpoint, filename, extraFields) {
            const upload = await uploadBlob();
            if (upload.error) {
                setStatusKey(upload.error, upload.error === 'previewFailed' ? 'var(--ds-warning)' : 'var(--ds-danger)');
                return;
            }

            const formData = new FormData();
            formData.append('file', upload.blob, upload.name);
            formData.append('fit', currentFit());
            formData.append('lang', locale);
            for (const [k, v] of Object.entries(extraFields)) formData.append(k, v);

            btnIco.disabled = btnPkg.disabled = true;
            setStatusKey('processing', 'var(--ds-info)');
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 60000);

            try {
                // Relativer Aufruf passend zum Subpath
                const res = await fetch(endpoint, { method: 'POST', body: formData, signal: controller.signal });
                if (!res.ok) throw new Error(await errorMessage(res));

                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);

                setStatusKey('done', 'var(--ds-success)');
            } catch (err) {
                if (err.name === 'AbortError') setStatusKey('timeout', 'var(--ds-danger)');
                else setStatus(err.message, 'var(--ds-danger)');
            } finally {
                clearTimeout(timeout);
                btnIco.disabled = btnPkg.disabled = false;
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const sizes = selectedSizes();
            if (!sizes.length) {
                setStatusKey('noSize', 'var(--ds-danger)');
                return;
            }
            generate('convert', 'favicon.ico', { sizes: sizes.join(','), ...styleFields() });
        });

        btnPkg.addEventListener('click', () => {
            generate('package', 'favicon-package.zip', {
                app_name: appName.value,
                theme_color: themeEnabled.checked ? themeColor.value : '',
                svg: currentMode() === 'image' && svgText !== null ? svgText : '',
                ...styleFields(),
            });
        });

        applyTranslations();
        updateDropzoneLabel();
        updateStyleControls();
        loadSnippet();
        loadFontList();
    })();
    </script>
</body>
</html>
