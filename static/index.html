<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon Generator – favicon.ico &amp; Favicon-Paket erstellen | KodiniTools</title>
    <!-- SEO: wird vom Server je Sprache ersetzt (main.py, render_index) -->
    <!--SEO-->
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a1324" media="(prefers-color-scheme: dark)">
    <!-- Theme vor dem ersten Paint setzen (Tokens: Dark auf :root, Light über data-theme),
         wie im Collage Maker. Standard ist Light. -->
    <script>
        try {
            document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
        // Sprache vor dem ersten Paint setzen: ?lang=de|en (Links/hreflang) hat Vorrang, sonst
        // localStorage-Key 'locale' wie im Collage Maker; ohne beides gilt die vom Server gesetzte Sprache.
        (function () {
            var param = new URLSearchParams(location.search).get('lang');
            var lang = param === 'en' || param === 'de' ? param : null;
            try {
                if (lang) localStorage.setItem('locale', lang);
                else lang = localStorage.getItem('locale');
            } catch (e) { /* Storage gesperrt */ }
            if (lang === 'en' || lang === 'de') document.documentElement.setAttribute('lang', lang);
        })();
    </script>
    <!-- Design-Tokens v2 (--ds-*), Kopie aus KodiniTools/Collage-Maker src/design-system/tokens-v2.css -->
    <link rel="stylesheet" href="static/design-system/tokens-v2.css">
    <style>
        /* Schrift: Supreme (400/500/700), wie im Collage Maker */
        @font-face { font-family: 'Supreme'; font-weight: 400; font-style: normal; font-display: swap; src: url('static/fonts/Supreme-Regular.woff2') format('woff2'); }
        @font-face { font-family: 'Supreme'; font-weight: 500; font-style: normal; font-display: swap; src: url('static/fonts/Supreme-Medium.woff2') format('woff2'); }
        @font-face { font-family: 'Supreme'; font-weight: 700; font-style: normal; font-display: swap; src: url('static/fonts/Supreme-Bold.woff2') format('woff2'); }

        :root[data-theme='dark'] { color-scheme: dark; }
        :root[data-theme='light'] { color-scheme: light; }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: var(--ds-font-sans);
            font-size: var(--ds-text-lg);
            line-height: var(--ds-leading);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: var(--ds-surface-0);
            color: var(--ds-text);
            transition: background-color var(--ds-duration-slow) var(--ds-ease), color var(--ds-duration-slow) var(--ds-ease);
        }

        /* === SSI-Partials (nav/footer außerhalb von #app), übernommen aus dem Collage Maker ===
           Eigene Hintergründe entfernen, damit die Seitenfläche durchscheint — außer beim Cookie-Banner. */
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']) {
            background-color: transparent !important;
        }
        :where(body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']))
            :where(*:not(.cookie-banner):not(.cookie-consent):not([class*='cookie'])) {
            background-color: transparent !important;
        }
        /* Dropdowns/Submenüs der SSI-Navigation bekommen wieder eine feste Fläche */
        body > :not(#app):not(script) [class*='drop'],
        body > :not(#app):not(script) [class*='sub-menu'],
        body > :not(#app):not(script) [class*='submenu'],
        body > :not(#app):not(script) [class*='popup'],
        body > :not(#app):not(script) [class*='popover'],
        body > :not(#app):not(script) [class*='megamenu'] {
            background-color: var(--ds-surface-1) !important;
        }
        /* Hamburger-Balken und SVG-Icons der Navigation in Textfarbe */
        body > :not(#app):not(script) span:empty,
        body > :not(#app):not(script) [aria-expanded] > span:empty,
        body > :not(#app):not(script) [aria-expanded] > span > span:empty,
        body > :not(#app):not(script) [aria-expanded] > div > span:empty {
            background-color: currentColor !important;
            border-color: currentColor !important;
        }
        body > :not(#app):not(script) button svg line,
        body > :not(#app):not(script) button svg path,
        body > :not(#app):not(script) button svg rect,
        body > :not(#app):not(script) [aria-expanded] svg line,
        body > :not(#app):not(script) [aria-expanded] svg path,
        body > :not(#app):not(script) [aria-expanded] svg rect,
        body > :not(#app):not(script) [role='button'] svg line,
        body > :not(#app):not(script) [role='button'] svg path,
        body > :not(#app):not(script) [role='button'] svg rect {
            stroke: currentColor !important;
            fill: currentColor !important;
        }
        body > :not(#app):not(script) [class*='toggler-icon'] { filter: brightness(0) saturate(100%) !important; }
        :root[data-theme='dark'] body > :not(#app):not(script) [class*='toggler-icon'] {
            filter: brightness(0) saturate(100%) invert(1) !important;
        }
        /* Cookie-Banner: immer im Vordergrund, über Nav und Dropdowns */
        .cookie-banner, .cookie-consent,
        [class*='cookie-banner'], [class*='cookie-consent'],
        [id*='cookie-banner'], [id*='cookie-consent'] {
            z-index: 10000 !important;
            position: fixed !important;
        }
        /* Textfarben der SSI-Partials aus den Tokens (Cookie-Banner ausgenommen) */
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']):not([id*='cookie']),
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']):not([id*='cookie']) *:not([class*='cookie']):not([id*='cookie']) {
            color: var(--ds-text) !important;
        }
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']):not([id*='cookie']) a:not([class*='cookie']):not([id*='cookie']),
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']):not([id*='cookie']) a:not([class*='cookie']):not([id*='cookie']) * {
            color: var(--ds-link) !important;
        }
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']):not([id*='cookie']) a:hover:not([class*='cookie']):not([id*='cookie']),
        body > :not(#app):not(script):not(.cookie-banner):not(.cookie-consent):not([class*='cookie']):not([id*='cookie']) a:hover:not([class*='cookie']):not([id*='cookie']) * {
            color: var(--ds-accent) !important;
        }

        /* === App === */
        #app {
            display: flex;
            justify-content: center;
            padding: var(--ds-space-12) var(--ds-space-4);
        }
        .card {
            background: var(--ds-surface-1);
            padding: var(--ds-space-10);
            border-radius: var(--ds-radius-lg);
            border: var(--ds-border-width) solid var(--ds-border);
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        h1 {
            margin: 0 0 var(--ds-space-3);
            font-size: var(--ds-text-2xl);
            font-weight: var(--ds-weight-bold);
            line-height: var(--ds-leading-tight);
            letter-spacing: var(--ds-tracking-tight);
            color: var(--ds-text);
        }
        p { color: var(--ds-text-2); font-size: var(--ds-text-md); margin: 0 0 var(--ds-space-6); }
        code { font-family: var(--ds-font-mono); font-size: 0.9em; }
        .dropzone {
            position: relative;
            display: block;
            border: 2px dashed var(--ds-border-strong);
            border-radius: var(--ds-radius-md);
            padding: var(--ds-space-10) var(--ds-space-4);
            cursor: pointer;
            color: var(--ds-text-2);
            background: var(--ds-surface-0);
            transition: border-color var(--ds-duration) var(--ds-ease), background-color var(--ds-duration) var(--ds-ease);
        }
        .dropzone:hover, .dropzone.dragover { border-color: var(--ds-accent); background: var(--ds-accent-soft); color: var(--ds-text); }
        .dropzone:focus-within { box-shadow: var(--ds-focus-ring); }
        /* Visuell versteckt, aber per Tastatur fokussierbar und für Screenreader erreichbar
           (display: none würde die Dateiauswahl aus der Tab-Reihenfolge entfernen) */
        input[type="file"] {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }
        fieldset {
            border: var(--ds-border-width) solid var(--ds-border);
            border-radius: var(--ds-radius-md);
            margin: var(--ds-space-5) 0 0;
            padding: var(--ds-space-3) var(--ds-space-4) var(--ds-space-4);
            text-align: left;
        }
        legend { color: var(--ds-text-2); font-size: var(--ds-text-sm); font-weight: var(--ds-weight-medium); padding: 0 var(--ds-space-2); }
        .options { display: flex; flex-wrap: wrap; gap: var(--ds-space-2) var(--ds-space-4); }
        .options label { font-size: var(--ds-text-md); cursor: pointer; display: inline-flex; align-items: center; gap: var(--ds-space-1); }
        input[type="radio"], input[type="checkbox"] { accent-color: var(--ds-accent); }
        input[type="text"] {
            width: 100%;
            padding: var(--ds-space-2) var(--ds-space-3);
            border-radius: var(--ds-radius-sm);
            border: var(--ds-border-width) solid var(--ds-border-strong);
            background: var(--ds-surface-1);
            color: var(--ds-text);
            font: inherit;
            font-size: var(--ds-text-sm);
        }
        input[type="text"]::placeholder { color: var(--ds-text-3); }
        input:focus-visible, button:focus-visible { outline: none; box-shadow: var(--ds-focus-ring); }
        #preview { display: none; margin-top: var(--ds-space-5); align-items: flex-end; justify-content: center; gap: var(--ds-space-4); }
        #preview figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: var(--ds-space-1); }
        #preview figcaption { font-size: var(--ds-text-xs); color: var(--ds-text-3); }
        #preview canvas {
            /* Schachbrett zur Darstellung von Transparenz */
            background: repeating-conic-gradient(var(--ds-surface-3) 0% 25%, var(--ds-surface-1) 0% 50%) 0 0 / 8px 8px;
            image-rendering: pixelated;
            border: var(--ds-border-width) solid var(--ds-border);
            border-radius: 2px;
        }
        .buttons { display: flex; gap: var(--ds-space-3); margin-top: var(--ds-space-6); }
        button {
            flex: 1;
            min-height: var(--ds-control-lg);
            background: var(--ds-accent);
            color: var(--ds-on-accent);
            border: var(--ds-border-width) solid transparent;
            padding: var(--ds-space-3);
            border-radius: var(--ds-radius-md);
            font: inherit;
            font-size: var(--ds-text-lg);
            font-weight: var(--ds-weight-semibold);
            cursor: pointer;
            transition: background-color var(--ds-duration) var(--ds-ease), border-color var(--ds-duration) var(--ds-ease);
        }
        button:hover { background: var(--ds-accent-hover); }
        button.secondary { background: var(--ds-surface-2); color: var(--ds-text); border-color: var(--ds-border-strong); }
        button.secondary:hover { background: var(--ds-surface-3); border-color: var(--ds-accent); }
        button:disabled { opacity: 0.6; cursor: wait; }
        #status { margin-top: var(--ds-space-4); font-size: var(--ds-text-md); font-weight: var(--ds-weight-medium); min-height: 1.5em; }
        @media (max-width: 480px) {
            #app { padding: var(--ds-space-6) var(--ds-space-4); }
            .card { padding: var(--ds-space-6); }
            .buttons { flex-direction: column; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <!--#include virtual="/partials/nav.html" -->
    <main id="app">
    <div class="card">
        <h1 data-i18n="title">Favicon Konverter</h1>
        <p data-i18n-html="intro">Erstelle aus einem Bild (PNG, JPG, WebP, GIF, BMP – max. 10&nbsp;MB) ein <code>favicon.ico</code> oder ein komplettes Favicon-Paket.</p>

        <form id="uploadForm">
            <label class="dropzone" id="dropzone">
                <span id="label-text">Datei auswählen oder hierher ziehen</span>
                <input type="file" id="fileInput" name="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" required>
            </label>

            <div id="preview">
                <figure><canvas id="pv64" width="64" height="64"></canvas><figcaption>64</figcaption></figure>
                <figure><canvas id="pv32" width="32" height="32"></canvas><figcaption>32</figcaption></figure>
                <figure><canvas id="pv16" width="16" height="16"></canvas><figcaption>16</figcaption></figure>
            </div>

            <fieldset>
                <legend data-i18n="fitLegend">Nicht-quadratische Bilder</legend>
                <div class="options">
                    <label><input type="radio" name="fit" value="pad" checked> <span data-i18n="fitPad">Transparent auffüllen</span></label>
                    <label><input type="radio" name="fit" value="crop"> <span data-i18n="fitCrop">Mittig zuschneiden</span></label>
                </div>
            </fieldset>

            <fieldset>
                <legend data-i18n="sizesLegend">ICO-Größen (px)</legend>
                <div class="options" id="sizeOptions"></div>
            </fieldset>

            <fieldset>
                <legend data-i18n="appNameLegend">App-Name für site.webmanifest (optional, nur Paket)</legend>
                <input type="text" id="appName" maxlength="60" placeholder="z. B. Meine Webseite" data-i18n-placeholder="appNamePlaceholder">
            </fieldset>

            <div class="buttons">
                <button type="submit" id="btnIco">favicon.ico</button>
                <button type="button" id="btnPkg" class="secondary" data-i18n="btnPackage">Komplettes Paket (ZIP)</button>
            </div>
        </form>
        <div id="status" role="status" aria-live="polite"></div>
    </div>
    </main>
    <!--#include virtual="/partials/footer.html" -->
    <!--#include virtual="/partials/cookie-banner.html" -->

    <script>
    // Eigener Scope: keine globalen Namen, die mit Skripten der SSI-Partials kollidieren
    (() => {
        // Theme-Wechsel der globalen SSI-Navigation (html[data-theme]) übernehmen:
        // body.light-theme für Token-Parität, Auswahl in localStorage merken.
        function syncTheme() {
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            document.body.classList.toggle('light-theme', theme === 'light');
            try { localStorage.setItem('theme', theme); } catch (_) { /* Storage gesperrt */ }
        }
        syncTheme();
        new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        // === i18n (DE/EN) ===
        // Mechanismus wie im Collage Maker: localStorage 'locale', Event 'locale-changed' (detail.locale)
        // der globalen SSI-Navigation, Buttons .global-nav-lang-btn[data-lang], Nav-Texte über data-i18n.
        const MESSAGES = {
            de: {
                pageTitle: 'Favicon Generator – favicon.ico & Favicon-Paket erstellen | KodiniTools',
                title: 'Favicon Konverter',
                intro: 'Erstelle aus einem Bild (PNG, JPG, WebP, GIF, BMP – max. 10&nbsp;MB) ein <code>favicon.ico</code> oder ein komplettes Favicon-Paket.',
                dropzone: 'Datei auswählen oder hierher ziehen',
                fitLegend: 'Nicht-quadratische Bilder',
                fitPad: 'Transparent auffüllen',
                fitCrop: 'Mittig zuschneiden',
                sizesLegend: 'ICO-Größen (px)',
                appNameLegend: 'App-Name für site.webmanifest (optional, nur Paket)',
                appNamePlaceholder: 'z. B. Meine Webseite',
                btnPackage: 'Komplettes Paket (ZIP)',
                previewFailed: 'Vorschau nicht möglich – Datei ist evtl. kein gültiges Bild.',
                tooLarge: 'Datei zu groß (max. 10 MB).',
                noFile: 'Bitte zuerst eine Datei auswählen.',
                processing: 'Wird verarbeitet...',
                done: 'Fertig! Download gestartet.',
                timeout: 'Zeitüberschreitung – bitte erneut versuchen.',
                noSize: 'Mindestens eine Größe auswählen.',
                httpError: 'Konvertierung fehlgeschlagen (HTTP {status})',
            },
            en: {
                pageTitle: 'Favicon Generator – Create favicon.ico & favicon package | KodiniTools',
                title: 'Favicon Converter',
                intro: 'Create a <code>favicon.ico</code> or a complete favicon package from an image (PNG, JPG, WebP, GIF, BMP – max. 10&nbsp;MB).',
                dropzone: 'Choose a file or drag it here',
                fitLegend: 'Non-square images',
                fitPad: 'Pad with transparency',
                fitCrop: 'Crop to center',
                sizesLegend: 'ICO sizes (px)',
                appNameLegend: 'App name for site.webmanifest (optional, package only)',
                appNamePlaceholder: 'e.g. My Website',
                btnPackage: 'Complete package (ZIP)',
                previewFailed: 'Preview not available – the file may not be a valid image.',
                tooLarge: 'File too large (max. 10 MB).',
                noFile: 'Please choose a file first.',
                processing: 'Processing...',
                done: 'Done! Download started.',
                timeout: 'Request timed out – please try again.',
                noSize: 'Select at least one size.',
                httpError: 'Conversion failed (HTTP {status})',
            },
        };
        // Texte der SSI-Navigation (Schlüssel = data-i18n in nav.html), Kopie aus Collage Maker src/stores/settings.ts
        const NAV_MESSAGES = {
            de: {
                'nav.audioTools': 'Audiotools', 'nav.mp3Converter': 'MP3 Konverter',
                'nav.audioEqualizer': 'Interaktiver Audio Equalizer', 'nav.modernPlayer': 'Moderner Musikplayer',
                'nav.ultimatePlayer': 'Ultimativer Musikplayer', 'nav.playlistGenerator': 'Wiedergabeliste Generator',
                'nav.playlistConverter': 'Wiedergabeliste Konverter', 'nav.alarmTool': 'Alarmtool',
                'nav.audioNormalizer': 'Audio Normalizer', 'nav.visualizer': 'Visualizer',
                'nav.equalizer19': '19-Band Equalizer', 'nav.audioConverter': 'Audio Konverter',
                'nav.imageTools': 'Bildtools', 'nav.imageConverter': 'Bildkonverter',
                'nav.batchImageEditor': 'Bildserie bearbeiten', 'nav.photoCollage': 'Fotocollage',
                'nav.tools': 'Tools', 'nav.colorExtractor': 'Kodini Farbextraktor',
                'nav.videoConverter': 'Videokonverter', 'nav.contact': 'Kontakt',
                'aria.toggleTheme': 'Theme wechseln', 'aria.selectLanguage': 'Sprache wählen',
                'aria.menuOpen': 'Menü öffnen', 'aria.menuClose': 'Menü schliessen', 'aria.mainNav': 'Hauptnavigation',
            },
            en: {
                'nav.audioTools': 'Audio Tools', 'nav.mp3Converter': 'MP3 Converter',
                'nav.audioEqualizer': 'Interactive Audio Equalizer', 'nav.modernPlayer': 'Modern Music Player',
                'nav.ultimatePlayer': 'Ultimate Music Player', 'nav.playlistGenerator': 'Audio Playlist Generator',
                'nav.playlistConverter': 'Playlist to WebM Converter', 'nav.alarmTool': 'Alarm Tool',
                'nav.audioNormalizer': 'Audio Normalizer', 'nav.visualizer': 'Visualizer',
                'nav.equalizer19': '19-Band Equalizer', 'nav.audioConverter': 'Audio Converter',
                'nav.imageTools': 'Image Tools', 'nav.imageConverter': 'Image Converter',
                'nav.batchImageEditor': 'Batch Image Editor', 'nav.photoCollage': 'Photo Collage',
                'nav.tools': 'Tools', 'nav.colorExtractor': 'Kodini Color Extractor',
                'nav.videoConverter': 'Video Converter', 'nav.contact': 'Contact',
                'aria.toggleTheme': 'Toggle theme', 'aria.selectLanguage': 'Select language',
                'aria.menuOpen': 'Open menu', 'aria.menuClose': 'Close menu', 'aria.mainNav': 'Main navigation',
            },
        };

        let locale = document.documentElement.getAttribute('lang') === 'en' ? 'en' : 'de';

        function t(key, vars) {
            let text = MESSAGES[locale][key] ?? MESSAGES.de[key] ?? key;
            for (const [k, v] of Object.entries(vars || {})) text = text.replace('{' + k + '}', v);
            return text;
        }

        function translateNav() {
            const nav = document.querySelector('.global-nav');
            if (!nav) return;
            const msgs = NAV_MESSAGES[locale];
            nav.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (msgs[key]) el.textContent = msgs[key];
            });
            nav.querySelectorAll('[data-i18n-aria]').forEach(el => {
                const key = el.getAttribute('data-i18n-aria');
                if (msgs[key]) el.setAttribute('aria-label', msgs[key]);
            });
            nav.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                if (msgs[key]) el.setAttribute('title', msgs[key]);
            });
            document.querySelectorAll('.global-nav-lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === locale);
            });
        }

        // Nur #app übersetzen; die Navigation hat eigene data-i18n-Schlüssel (translateNav)
        function applyTranslations() {
            const root = document.getElementById('app');
            document.documentElement.setAttribute('lang', locale);
            document.title = t('pageTitle');
            root.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
            root.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.getAttribute('data-i18n-html')); });
            root.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder')));
            });
            translateNav();
        }

        const MAX_BYTES = 10 * 1024 * 1024;
        const ALLOWED_SIZES = [16, 24, 32, 48, 64, 128, 256];
        const DEFAULT_SIZES = [16, 32, 48, 64];

        const fileInput = document.getElementById('fileInput');
        const dropzone = document.getElementById('dropzone');
        const labelText = document.getElementById('label-text');
        const form = document.getElementById('uploadForm');
        const status = document.getElementById('status');
        const preview = document.getElementById('preview');
        const sizeOptions = document.getElementById('sizeOptions');
        const btnIco = document.getElementById('btnIco');
        const btnPkg = document.getElementById('btnPkg');
        const appName = document.getElementById('appName');

        let previewImage = null;
        // Zuletzt angezeigte eigene Statusmeldung, damit sie beim Sprachwechsel neu übersetzt wird
        let statusMsg = null;

        for (const size of ALLOWED_SIZES) {
            const label = document.createElement('label');
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.name = 'size';
            cb.value = String(size);
            cb.checked = DEFAULT_SIZES.includes(size);
            label.append(cb, ' ' + size);
            sizeOptions.append(label);
        }

        function setStatus(text, color) {
            statusMsg = null;
            status.textContent = text;
            status.style.color = color;
        }

        function setStatusKey(key, color, vars) {
            setStatus(t(key, vars), color);
            statusMsg = { key, color, vars };
        }

        function updateDropzoneLabel() {
            const file = fileInput.files[0];
            labelText.textContent = file ? file.name : t('dropzone');
        }

        function setLocale(newLocale) {
            if (newLocale !== 'de' && newLocale !== 'en') return;
            locale = newLocale;
            try { localStorage.setItem('locale', locale); } catch (_) { /* Storage gesperrt */ }
            // Ein vorhandenes ?lang= mitführen, sonst würde es beim Neuladen die Auswahl überschreiben
            const url = new URL(location.href);
            if (url.searchParams.has('lang')) {
                url.searchParams.set('lang', locale);
                history.replaceState(null, '', url);
            }
            applyTranslations();
            updateDropzoneLabel();
            if (statusMsg) setStatusKey(statusMsg.key, statusMsg.color, statusMsg.vars);
        }

        // Umschalter der globalen SSI-Navigation
        window.addEventListener('locale-changed', e => setLocale(e.detail && e.detail.locale));
        // Fallback, falls die Navigation das Event nicht selbst auslöst
        document.addEventListener('click', e => {
            const btn = e.target.closest && e.target.closest('.global-nav-lang-btn[data-lang]');
            if (btn) setLocale(btn.getAttribute('data-lang'));
        });
        // Sprachwechsel in einem anderen Tab übernehmen
        window.addEventListener('storage', e => { if (e.key === 'locale' && e.newValue) setLocale(e.newValue); });

        function currentFit() {
            return form.querySelector('input[name="fit"]:checked').value;
        }

        function selectedSizes() {
            return [...sizeOptions.querySelectorAll('input:checked')].map(cb => cb.value);
        }

        function drawPreview() {
            if (!previewImage) return;
            const w = previewImage.naturalWidth;
            const h = previewImage.naturalHeight;
            const crop = currentFit() === 'crop';
            for (const size of [64, 32, 16]) {
                const ctx = document.getElementById('pv' + size).getContext('2d');
                ctx.clearRect(0, 0, size, size);
                ctx.imageSmoothingQuality = 'high';
                if (crop) {
                    const side = Math.min(w, h);
                    ctx.drawImage(previewImage, (w - side) / 2, (h - side) / 2, side, side, 0, 0, size, size);
                } else {
                    const scale = size / Math.max(w, h);
                    const dw = w * scale, dh = h * scale;
                    ctx.drawImage(previewImage, (size - dw) / 2, (size - dh) / 2, dw, dh);
                }
            }
            preview.style.display = 'flex';
        }

        function loadPreview(file) {
            previewImage = null;
            preview.style.display = 'none';
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(url);
                previewImage = img;
                drawPreview();
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                setStatusKey('previewFailed', 'var(--ds-warning)');
            };
            img.src = url;
        }

        function onFileSelected() {
            setStatus('', '');
            const file = fileInput.files[0];
            if (!file) return;
            labelText.textContent = file.name;
            if (file.size > MAX_BYTES) {
                setStatusKey('tooLarge', 'var(--ds-danger)');
                return;
            }
            loadPreview(file);
        }

        fileInput.addEventListener('change', onFileSelected);
        form.querySelectorAll('input[name="fit"]').forEach(r => r.addEventListener('change', drawPreview));

        ['dragenter', 'dragover'].forEach(ev => dropzone.addEventListener(ev, e => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        }));
        ['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
        }));
        dropzone.addEventListener('drop', e => {
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                onFileSelected();
            }
        });

        async function errorMessage(res) {
            try {
                const data = await res.json();
                if (typeof data.detail === 'string') return data.detail;
            } catch (_) { /* keine JSON-Antwort */ }
            return t('httpError', { status: res.status });
        }

        async function generate(endpoint, filename, extraFields) {
            const file = fileInput.files[0];
            if (!file) {
                setStatusKey('noFile', 'var(--ds-danger)');
                return;
            }
            if (file.size > MAX_BYTES) {
                setStatusKey('tooLarge', 'var(--ds-danger)');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            formData.append('fit', currentFit());
            formData.append('lang', locale);
            for (const [k, v] of Object.entries(extraFields)) formData.append(k, v);

            btnIco.disabled = btnPkg.disabled = true;
            setStatusKey('processing', 'var(--ds-info)');
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 60000);

            try {
                // Relativer Aufruf passend zum Subpath
                const res = await fetch(endpoint, { method: 'POST', body: formData, signal: controller.signal });
                if (!res.ok) throw new Error(await errorMessage(res));

                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);

                setStatusKey('done', 'var(--ds-success)');
            } catch (err) {
                if (err.name === 'AbortError') setStatusKey('timeout', 'var(--ds-danger)');
                else setStatus(err.message, 'var(--ds-danger)');
            } finally {
                clearTimeout(timeout);
                btnIco.disabled = btnPkg.disabled = false;
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const sizes = selectedSizes();
            if (!sizes.length) {
                setStatusKey('noSize', 'var(--ds-danger)');
                return;
            }
            generate('convert', 'favicon.ico', { sizes: sizes.join(',') });
        });

        btnPkg.addEventListener('click', () => {
            if (!fileInput.reportValidity()) return;
            generate('package', 'favicon-package.zip', { app_name: appName.value });
        });

        applyTranslations();
        updateDropzoneLabel();
    })();
    </script>
</body>
</html>
